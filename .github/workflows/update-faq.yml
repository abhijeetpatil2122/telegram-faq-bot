name: Update Telegram Knowledge

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate webhook
        run: node --check api/telegram.js

      - name: Crawl official Telegram sources
        run: node scripts/crawl-faq.mjs

      - name: Validate generated knowledge
        run: node scripts/validate-knowledge.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- data/knowledge.json; then
            echo 'No knowledge changes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/knowledge.json
          git commit -m 'chore(data): update Telegram knowledge'
          git push
