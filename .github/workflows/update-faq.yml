name: Update Telegram Knowledge

on:
  push:
    branches: [main]
    paths:
      - 'scripts/crawl/**'
      - 'scripts/validate-knowledge.mjs'
      - 'scripts/validate-rich-knowledge.mjs'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/update-faq.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install crawler dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate webhook
        run: node --check api/telegram.js
      - name: Validate crawler
        run: node --check scripts/crawl/index.mjs
      - name: Validate validators
        run: node --check scripts/validate-knowledge.mjs && node --check scripts/validate-rich-knowledge.mjs
      - name: Crawl official Telegram sources
        run: node scripts/crawl/index.mjs
      - name: Validate generated knowledge
        run: npm run validate
      - name: Commit changes
        run: |
          if git diff --quiet -- data/knowledge.json data/crawl-state.json; then
            echo 'No knowledge changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/knowledge.json data/crawl-state.json
          git commit -m 'chore(data): update Telegram knowledge'
          git push
