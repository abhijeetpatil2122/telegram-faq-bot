name: Update Telegram Knowledge

# Search benchmark, runtime hardening tests and knowledge validation are part of every knowledge update.
# Benchmark accepts all relevant official sources for each intent.

on:
  push:
    branches: [main]
    paths:
      - 'api/telegram.js'
      - 'scripts/crawl/**'
      - 'scripts/tests/**'
      - 'scripts/search-engine.mjs'
      - 'scripts/validate-knowledge.mjs'
      - 'scripts/validate-rich-knowledge.mjs'
      - 'config/**'
      - 'package.json'
      - '.github/workflows/update-faq.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install crawler dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate webhook
        run: node --check api/telegram.js
      - name: Validate crawler and search tests
        run: npm run check
      - name: Run runtime hardening tests
        run: npm run runtime:test
      - name: Crawl official Telegram sources
        run: node scripts/crawl/index.mjs
      - name: Validate generated knowledge
        run: npm run validate
      - name: Run search regression tests
        run: npm run search:test
      - name: Run search benchmark
        run: npm run search:benchmark
      - name: Commit changes
        run: |
          if git diff --quiet -- data/knowledge.json data/crawl-state.json; then
            echo 'No knowledge changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/knowledge.json data/crawl-state.json
          git commit -m 'chore(data): update Telegram knowledge'
          git push
