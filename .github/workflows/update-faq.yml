name: Update Telegram Knowledge

# Search benchmark, runtime hardening tests and knowledge validation are part of every knowledge update.
# Benchmark accepts all relevant official sources for each intent.

on:
  push:
    branches: [main]
    paths:
      - 'api/telegram.js'
      - 'scripts/crawl/**'
      - 'scripts/tests/**'
      - 'scripts/search-engine.mjs'
      - 'scripts/validate-knowledge.mjs'
      - 'scripts/validate-rich-knowledge.mjs'
      - 'config/**'
      - 'package.json'
      - '.github/workflows/update-faq.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install crawler dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Patch verified admin runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('api/telegram.js')
          s = p.read_text()
          if 'const GITHUB_REPOSITORY =' not in s:
              s = s.replace("const RICH_FALLBACK_BYTES = 30000;\n", "const RICH_FALLBACK_BYTES = 30000;\nconst GITHUB_REPOSITORY = process.env.GITHUB_REPOSITORY ?? 'abhijeetpatil2122/telegram-faq-bot';\nconst GITHUB_WORKFLOW = process.env.GITHUB_WORKFLOW ?? 'update-faq.yml';\nconst GITHUB_API_VERSION = '2026-03-10';\n", 1)
          if 'function answerCallbackQuerySafe(' not in s:
              marker = "function isExpiredInlineQueryError(error) {\n  return error?.status === 400 && /query is too old|response timeout expired|query id is invalid/i.test(error?.description ?? error?.message ?? '');\n}\n"
              helpers = marker + "\nfunction isExpiredCallbackQueryError(error) {\n  return error?.status === 400 && /query is too old|response timeout expired|query ID is invalid/i.test(error?.description ?? error?.message ?? '');\n}\n\nasync function answerCallbackQuerySafe(callbackId, payload = {}) {\n  try {\n    await telegram('answerCallbackQuery', { callback_query_id: callbackId, ...payload });\n  } catch (error) {\n    if (!isExpiredCallbackQueryError(error)) throw error;\n    console.warn('Ignoring expired callback query:', error.description ?? error.message);\n  }\n}\n\nasync function triggerCrawlWorkflow() {\n  const token = String(process.env.GITHUB_TOKEN ?? '').trim();\n  if (!token) throw new Error('GITHUB_TOKEN is not configured for manual crawl control');\n  const url = `https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${encodeURIComponent(GITHUB_WORKFLOW)}/dispatches`;\n  const response = await fetch(url, { method: 'POST', headers: { accept: 'application/vnd.github+json', authorization: `Bearer ${token}`, 'content-type': 'application/json', 'x-github-api-version': GITHUB_API_VERSION }, body: JSON.stringify({ ref: 'main' }) });\n  if (!response.ok) { const body = await response.text().catch(() => ''); throw new Error(`GitHub workflow dispatch failed: HTTP ${response.status} ${body}`.trim()); }\n}\n"
              if marker not in s: raise SystemExit('callback helper insertion marker not found')
              s = s.replace(marker, helpers, 1)
          if "adminButton('▶️ Run Crawl', 'adm:run-crawl'" not in s:
              pattern = r"function adminCrawlHtml\(\) \{[\s\S]*?\n\}\n\nfunction adminSourcesHtml"
              replacement = "function adminCrawlHtml() {\n  const state = loadCrawlState();\n  const sources = Object.entries(state?.sources ?? {}).sort((a, b) => b[1].items - a[1].items);\n  return [\n    '<h2>🔄 Crawl Status</h2>',\n    `<p><b>Status:</b> ${htmlEscape(state?.status ?? 'unknown')}<br/><b>Generated:</b> ${htmlEscape(formatIndiaDateTime(state?.generatedAt))}<br/><b>Total entries:</b> ${state?.totalItems ?? KNOWLEDGE.length}<br/><b>Total sources:</b> ${state?.totalSources ?? sources.length}</p>`,\n    '<details><summary>Source item counts</summary>',\n    `<ul>${sources.map(([id, info]) => `<li><code>${htmlEscape(id)}</code> — ${Number(info?.items ?? 0)}</li>`).join('')}</ul></details>`,\n    '<hr/>',\n    adminRows([[adminButton('▶️ Run Crawl', 'adm:run-crawl', 'success'), adminButton('↩️ Back', 'adm:home', 'link')]])\n  ].join('\\n');\n}\n\nfunction adminCrawlStartedHtml(error = null) {\n  if (error) return ['<h2>🔄 Crawl Control</h2>', `<p><b>❌ Unable to start crawl.</b><br/>${htmlEscape(error)}</p>`, '<footer>Configure the GitHub Actions token in Vercel before using manual crawl control.</footer>', adminRows([[adminButton('↩️ Back', 'adm:home', 'link'), adminButton('🔄 Try Again', 'adm:run-crawl')]])].join('\\n');\n  return ['<h2>🔄 Crawl Started</h2>', '<p>✅ The GitHub Actions crawl has been queued.</p>', '<p>You will receive a private notification when the crawl finishes, including whether the knowledge base changed.</p>', adminRows([[adminButton('🔄 Crawl Status', 'adm:crawl'), adminButton('↩️ Back', 'adm:home', 'link')]])].join('\\n');\n}\n\nfunction adminSourcesHtml"
              s, n = re.subn(pattern, replacement, s, count=1)
              if n != 1: raise SystemExit('adminCrawlHtml block not found')
          if 'async function handleAdminCallback(update) {' not in s:
              pattern = r"async function handleAdminCallback\(update, profile\) \{[\s\S]*?\n\}\n\nfunction startMessageHtml"
              replacement = "async function handleAdminCallback(update) {\n  const callback = update.callback_query;\n  if (!callback?.id) return;\n  if (!isAdminUser(callback.from?.id)) { await answerCallbackQuerySafe(callback.id, { text: 'Not authorized.', show_alert: true }); return; }\n  const data = String(callback.data ?? '');\n  const page = data === 'adm:home' ? 'home' : data.startsWith('adm:') ? data.slice(4) : null;\n  if (!page || !['home', 'stats', 'crawl', 'run-crawl', 'sources', 'health', 'storage', 'system'].includes(page)) { await answerCallbackQuerySafe(callback.id); return; }\n  await answerCallbackQuerySafe(callback.id);\n  if (page === 'run-crawl') {\n    try { await triggerCrawlWorkflow(); await telegram('editMessageText', { chat_id: callback.message.chat.id, message_id: callback.message.message_id, rich_message: { html: adminCrawlStartedHtml() } }); }\n    catch (error) { await telegram('editMessageText', { chat_id: callback.message.chat.id, message_id: callback.message.message_id, rich_message: { html: adminCrawlStartedHtml(error?.message ?? 'Unknown error') } }); }\n    return;\n  }\n  const profile = page === 'system' ? await getBotProfile() : null;\n  await editAdminMessage(callback, page, profile);\n}\n\nfunction startMessageHtml"
              s, n = re.subn(pattern, replacement, s, count=1)
              if n != 1: raise SystemExit('admin callback block not found')
          s = s.replace("      if (update.callback_query) {\n        const profile = await getBotProfile();\n        await handleAdminCallback(update, profile);\n        return;\n      }", "      if (update.callback_query) {\n        await handleAdminCallback(update);\n        return;\n      }", 1)
          s = s.replace("].join('\\n');", "].join(' ');")
          p.write_text(s)
          print('Admin runtime patch applied.')
          PY
      - name: Save pre-crawl dataset
        run: |
          cp data/knowledge.json /tmp/knowledge-before.json
          cp data/crawl-state.json /tmp/crawl-state-before.json
      - name: Validate webhook
        run: node --check api/telegram.js
      - name: Validate crawler and search tests
        run: npm run check
      - name: Run runtime hardening tests
        run: npm run runtime:test
      - name: Crawl official Telegram sources
        run: node scripts/crawl/index.mjs
      - name: Calculate crawl changes
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const before = JSON.parse(fs.readFileSync('/tmp/knowledge-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('data/knowledge.json', 'utf8'));
          const oldMap = new Map((before.items ?? []).map((item) => [item.id, JSON.stringify(item)]));
          const newMap = new Map((after.items ?? []).map((item) => [item.id, JSON.stringify(item)]));
          let added = 0, removed = 0, updated = 0;
          for (const [id, value] of newMap) { if (!oldMap.has(id)) added += 1; else if (oldMap.get(id) !== value) updated += 1; }
          for (const id of oldMap.keys()) if (!newMap.has(id)) removed += 1;
          const state = JSON.parse(fs.readFileSync('data/crawl-state.json', 'utf8'));
          const summary = { added, removed, updated, total: Array.isArray(after.items) ? after.items.length : 0, sources: Object.keys(state.sources ?? {}).length, changed: added > 0 || removed > 0 || updated > 0, generatedAt: state.generatedAt ?? null };
          fs.writeFileSync('/tmp/crawl-summary.json', JSON.stringify(summary));
          console.log(summary);
          NODE
      - name: Validate generated knowledge
        run: npm run validate
      - name: Run search regression tests
        run: npm run search:test
      - name: Run search benchmark
        run: npm run search:benchmark
      - name: Commit changes
        run: |
          if git diff --quiet -- data/knowledge.json data/crawl-state.json api/telegram.js; then echo 'No knowledge or runtime changes.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/telegram.js data/knowledge.json data/crawl-state.json
          git commit -m 'chore(data): update Telegram knowledge'
          git push
      - name: Send crawl notification
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$ADMIN_IDS" ]; then echo 'BOT_TOKEN or ADMIN_IDS GitHub secret is not configured; skipping crawl notification.'; exit 0; fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const summary = JSON.parse(fs.readFileSync('/tmp/crawl-summary.json', 'utf8'));
          const crawlNumber = process.env.GITHUB_RUN_NUMBER ?? 'Unknown';

          function formatIndiaDateTime(value) {
            if (!value) return 'Unknown';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'Unknown';
            return new Intl.DateTimeFormat('en-IN', {
              timeZone: 'Asia/Kolkata',
              day: '2-digit',
              month: 'short',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: true,
              timeZoneName: 'short'
            }).format(date);
          }

          function nextCrawlAt(base = new Date()) {
            const next = new Date(base);
            next.setUTCSeconds(0, 0);
            next.setUTCMinutes(17);
            if (next <= base || next.getUTCHours() % 6 !== 0) {
              do {
                next.setUTCHours(next.getUTCHours() + 1);
                next.setUTCMinutes(17, 0, 0);
              } while (next.getUTCHours() % 6 !== 0);
            }
            return next;
          }

          function tableRow(label, value, header = false) {
            const tag = header ? 'th' : 'td';
            return `<tr><${tag}>${label}</${tag}><${tag}>${value}</${tag}></tr>`;
          }

          const completed = formatIndiaDateTime(summary.generatedAt);
          const nextCrawl = formatIndiaDateTime(nextCrawlAt());
          const rows = summary.changed
            ? [
                tableRow('Metric', 'Value', true),
                tableRow('New entries', `<b>${summary.added}</b>`),
                tableRow('Removed', `<b>${summary.removed}</b>`),
                tableRow('Updated', `<b>${summary.updated}</b>`),
                tableRow('Entries', `<b>${summary.total}</b>`),
                tableRow('Sources', `<b>${summary.sources}</b>`),
                tableRow('Completed', completed),
                tableRow('Next crawl', nextCrawl)
              ]
            : [
                tableRow('Metric', 'Value', true),
                tableRow('Entries', `<b>${summary.total}</b>`),
                tableRow('Sources', `<b>${summary.sources}</b>`),
                tableRow('Completed', completed),
                tableRow('Next crawl', nextCrawl)
              ];

          const status = summary.changed
            ? '<b>✅ Knowledge base updated</b>'
            : '<b>✅ No changes detected</b>';

          const html = [
            `<h2>🔄 Crawl Completed #${crawlNumber}</h2>`,
            `<p>${status}</p>`,
            `<table>${rows.join('')}</table>`
          ].join('');

          for (const chatId of String(process.env.ADMIN_IDS).split(',').map((v) => v.trim()).filter(Boolean)) {
            const response = await fetch(`https://api.telegram.org/bot${process.env.BOT_TOKEN}/sendRichMessage`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                chat_id: chatId,
                rich_message: { html },
                disable_notification: true
              })
            });
            if (!response.ok) console.error(`Notification failed for ${chatId}: HTTP ${response.status} ${await response.text()}`);
          }
          NODE
      - name: Send crawl failure notification
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$ADMIN_IDS" ]; then exit 0; fi
          node --input-type=module <<'NODE'
          const crawlNumber = process.env.GITHUB_RUN_NUMBER ?? 'Unknown';

          function formatIndiaDateTime(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return 'Unknown';
            return new Intl.DateTimeFormat('en-IN', {
              timeZone: 'Asia/Kolkata',
              day: '2-digit',
              month: 'short',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: true,
              timeZoneName: 'short'
            }).format(date);
          }

          function nextCrawlAt(base = new Date()) {
            const next = new Date(base);
            next.setUTCSeconds(0, 0);
            next.setUTCMinutes(17);
            if (next <= base || next.getUTCHours() % 6 !== 0) {
              do {
                next.setUTCHours(next.getUTCHours() + 1);
                next.setUTCMinutes(17, 0, 0);
              } while (next.getUTCHours() % 6 !== 0);
            }
            return next;
          }

          const html = [
            `<h2>🔄 Crawl Failed #${crawlNumber}</h2>`,
            '<p><b>❌ Knowledge crawl failed</b></p>',
            `<table><tr><th>Metric</th><th>Value</th></tr><tr><td>Next crawl</td><td>${formatIndiaDateTime(nextCrawlAt())}</td></tr></table>`,
            '<p>Please check GitHub Actions for details.</p>'
          ].join('');

          for (const chatId of String(process.env.ADMIN_IDS).split(',').map((v) => v.trim()).filter(Boolean)) {
            try {
              const response = await fetch(`https://api.telegram.org/bot${process.env.BOT_TOKEN}/sendRichMessage`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  chat_id: chatId,
                  rich_message: { html },
                  disable_notification: true
                })
              });
              if (!response.ok) console.error(`Failure notification failed for ${chatId}: HTTP ${response.status} ${await response.text()}`);
            } catch (error) {
              console.error(`Failure notification failed for ${chatId}:`, error?.message ?? error);
            }
          }
          NODE