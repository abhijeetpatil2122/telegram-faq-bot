name: Phase 4 Bot Runtime

on:
  push:
    paths:
      - 'phase4-trigger.txt'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Patch API runtime
        run: node scripts/phase4-patch.mjs

      - name: Validate runtime and search engine
        run: |
          node --check api/telegram.js
          node --check scripts/search-engine.mjs
          node --check scripts/tests/search-engine.mjs
          npm run search:engine:test
          npm run search:test

      - name: Commit runtime update
        run: |
          rm -f phase4-trigger.txt .github/workflows/phase4-bot-runtime.yml scripts/phase4-patch.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/telegram.js scripts/search-engine.mjs scripts/tests/search-engine.mjs package.json
          git rm --cached .github/workflows/phase4-bot-runtime.yml scripts/phase4-patch.mjs 2>/dev/null || true
          git add -u .github/workflows/phase4-bot-runtime.yml scripts/phase4-patch.mjs phase4-trigger.txt 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m 'feat(bot): upgrade retrieval ranking and rich message output'
          git push
